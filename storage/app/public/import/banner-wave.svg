  <rect width="1920" height="800" fill="url(#bg)"/>
  <ellipse cx="960" cy="520" rx="820" ry="300" fill="url(#glow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 0)">
    <path d="M0 560h300l40-160 60 320 70-420 70 520 60-260h210l40-160 60 320 70-420 70 520 60-260h230l40-160 60 320 70-420 70 520 60-260h300"
          stroke="url(#wave)" stroke-width="6" filter="url(#blur)" opacity="0.55"/>
    <path d="M0 560h300l40-160 60 320 70-420 70 520 60-260h210l40-160 60 320 70-420 70 520 60-260h230l40-160 60 320 70-420 70 520 60-260h300"
          stroke="url(#wave)" stroke-width="2.5" opacity="0.95"/>
  </g>

  <g fill="#22d3ee" opacity="0.5">
