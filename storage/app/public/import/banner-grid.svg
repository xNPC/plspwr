<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Decorative banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/>
      <stop offset="0.55" stop-color="#0a0a1a"/>
      <stop offset="1" stop-color="#141435"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.09"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="800" fill="url(#bg)"/>
  <rect width="1920" height="800" fill="url(#grid)"/>
  <rect width="1920" height="800" fill="url(#glow)"/>

  <g fill="none" stroke="url(#beam)" stroke-width="2">
    <path d="M0 520H1920" opacity="0.35"/>
    <path d="M0 640H1920" opacity="0.18"/>
    <path d="M240 0V800" opacity="0.16"/>
    <path d="M1680 0V800" opacity="0.16"/>
  </g>

  <g fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.5">
    <path d="M120 120h96M120 120v96"/>
    <path d="M1800 120h-96M1800 120v96"/>
  </g>

  <g fill="#22d3ee" opacity="0.55">
    <circle cx="240" cy="520" r="4"/>
    <circle cx="1680" cy="520" r="4"/>
    <circle cx="960" cy="640" r="3"/>
  </g>
</svg>
